<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AetherhausStudios — Tech Support</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap');
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  :root{
    --bg:#0d0814;--surface:rgba(26,14,42,0.88);--parchment:#f5f0e8;
    --amethyst:#7c4daa;--amethyst-light:#c9a7e8;--gold:#c4962a;--gold-light:#f0d48a;
    --smoke:#8a7e96;--border:rgba(124,77,170,0.25);--border-strong:rgba(124,77,170,0.5);
  }
  body{
    background:var(--bg);color:var(--parchment);
    font-family:'Crimson Pro',Georgia,serif;
    font-size:17px;line-height:1.6;min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    background-image:
      radial-gradient(ellipse at 30% 40%,rgba(124,77,170,0.18) 0%,transparent 55%),
      radial-gradient(ellipse at 70% 60%,rgba(196,150,42,0.08) 0%,transparent 55%),
      url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%237c4daa' fill-opacity='0.04'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
  }
  .wrap{max-width:520px;width:100%;padding:2rem 1.5rem;text-align:center;}
  .sigil{
    font-size:2.6rem;color:var(--amethyst-light);margin-bottom:1.5rem;
    animation:pulse 3s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{opacity:0.6;text-shadow:0 0 20px rgba(124,77,170,0.3);}
    50%{opacity:1;text-shadow:0 0 40px rgba(124,77,170,0.7);}
  }
  .site-title{
    font-family:'Cinzel Decorative',serif;font-size:1.9rem;font-weight:700;
    color:var(--gold);letter-spacing:0.03em;line-height:1.2;margin-bottom:0.3rem;
    text-shadow:0 0 40px rgba(196,150,42,0.2);
  }
  .site-sub{
    font-family:'Crimson Pro',serif;font-style:italic;
    color:var(--amethyst-light);font-size:1rem;margin-bottom:0.5rem;
  }
  .slogan{
    font-family:'Cinzel Decorative',serif;font-size:0.6rem;
    letter-spacing:0.14em;text-transform:uppercase;
    color:var(--gold-light);opacity:0.55;margin-bottom:2.2rem;
  }
  .card{
    background:var(--surface);border:1px solid var(--border-strong);
    border-radius:16px;padding:2.5rem 2rem;position:relative;overflow:hidden;
    backdrop-filter:blur(8px);box-shadow:0 8px 40px rgba(0,0,0,0.4);
  }
  .card::before{
    content:'';position:absolute;top:0;left:0;right:0;height:3px;
    background:linear-gradient(90deg,var(--amethyst),var(--gold),var(--amethyst));
  }
  .prompt{
    font-family:'Cinzel Decorative',serif;font-size:0.72rem;font-weight:400;
    letter-spacing:0.08em;color:var(--amethyst-light);margin-bottom:1.3rem;
    display:flex;align-items:center;gap:10px;justify-content:center;
  }
  .prompt::before,.prompt::after{
    content:'';flex:1;max-width:50px;height:1px;background:var(--border-strong);
  }
  select{
    font-family:'Crimson Pro',serif;font-size:17px;
    padding:12px 40px 12px 16px;
    border:1px solid var(--border-strong);border-radius:8px;
    background:#120920;color:var(--parchment);
    width:100%;margin-bottom:1.2rem;
    appearance:none;cursor:pointer;outline:none;
    background-image:url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 0l5 6 5-6z' fill='%23c9a7e8'/%3E%3C/svg%3E");
    background-repeat:no-repeat;background-position:right 14px center;
    transition:border-color 0.2s,box-shadow 0.2s;
  }
  select:focus{border-color:var(--amethyst);box-shadow:0 0 0 3px rgba(124,77,170,0.2);}
  select option{background:#1a0e2a;color:var(--parchment);}
  .go-btn{
    font-family:'Cinzel Decorative',serif;font-size:0.7rem;font-weight:700;
    letter-spacing:0.06em;padding:0.9rem 2rem;width:100%;
    background:linear-gradient(135deg,var(--amethyst),#5a3080);
    color:#fff;border:none;border-radius:8px;cursor:pointer;
    transition:all 0.2s;position:relative;overflow:hidden;
  }
  .go-btn::after{
    content:'';position:absolute;inset:0;
    background:linear-gradient(135deg,rgba(255,255,255,0.08),transparent);
    pointer-events:none;
  }
  .go-btn:hover{
    background:linear-gradient(135deg,#6a3d94,#4a2070);
    transform:translateY(-2px);box-shadow:0 6px 24px rgba(124,77,170,0.4);
  }
  .go-btn:active{transform:translateY(0);}
  .footer-runes{margin-top:2rem;display:flex;justify-content:center;gap:20px;font-size:17px;color:var(--amethyst);opacity:0.35;}
  .footer-note{margin-top:1rem;font-style:italic;font-size:13px;color:var(--smoke);opacity:0.65;}
  @media(max-width:480px){.site-title{font-size:1.4rem;}.card{padding:2rem 1.2rem;}}
</style>
</head>
<body>
<div class="wrap">
  <div class="sigil">⟡</div>
  <h1 class="site-title">AetherhausStudios</h1>
  <p class="site-sub">tech support, chaos management & general arcane troubleshooting</p>
  <p class="slogan">Chaos Managed. Probably.</p>

  <div class="card">
    <div class="prompt">Please select the nature of your Technological Chaos</div>
    <select id="destination" aria-label="Select the nature of your request">
      <option value="">— I am here because... —</option>
      <option value="ticket.html">I need Tech Support</option>
      <option value="hardware.html">I need Hardware Advice</option>
      <option value="report.html">I want to Report a Compromised Account</option>
    </select>
    <button class="go-btn" onclick="proceed()">Release Thy Request to the Maelstrom</button>
  </div>

  <div class="footer-runes"><span>✦</span><span>⊹</span><span>⟡</span><span>⊹</span><span>✦</span></div>
  <p class="footer-note">Operated by Aether · Managed by Hauscall · Chaos guaranteed</p>
</div>

<script>
  function proceed() {
    const dest = document.getElementById('destination').value;
    if (!dest) {
      const sel = document.getElementById('destination');
      sel.style.borderColor='#c44a2a';sel.style.boxShadow='0 0 0 3px rgba(196,74,42,0.2)';
      setTimeout(()=>{sel.style.borderColor='';sel.style.boxShadow='';},1200);
      return;
    }
    window.location.href = dest;
  }
</script>
</body>
</html>
